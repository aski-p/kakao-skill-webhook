# Claude Squad Configuration
squad:
  name: "Claude Squad"
  version: "1.0.0"
  description: "Multi-agent collaborative system for complex task execution"

settings:
  max_parallel_tasks: 5
  communication_protocol: async
  error_recovery: automatic
  logging_level: info

agents:
  available:
    - architect
    - developer
    - reviewer
    - coordinator
  
  auto_scaling:
    enabled: true
    min_agents: 1
    max_agents: 10

communication:
  message_queue: internal
  retry_policy:
    max_retries: 3
    backoff_multiplier: 2
  
collaboration:
  voting_enabled: true
  consensus_threshold: 0.7
  conflict_resolution: coordinator_decides

performance:
  task_timeout: 3600  # seconds
  heartbeat_interval: 30
  checkpoint_frequency: 300

integration:
  mcp_servers:
    - context7
    - sequential
    - magic
    - playwright
  
  external_tools:
    - git
    - docker
    - kubernetes